name = "anabelianAlgorithms"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AnabelianAlgorithms"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "anabelianlib"
git = "https://github.com/dagurtomas/AnabelianLib"
rev = "a8dd78c856cf472035148512f705439203ed0df6"

[[lean_lib]]
name = "AnabelianAlgorithms"
